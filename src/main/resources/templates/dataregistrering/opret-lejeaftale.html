<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Opret Lejeaftale</title>
    <link rel="stylesheet" th:href="@{/css/formular.css}"/>

</head>

<body>

<div th:replace="~{fragments/layout :: html(~{::content})}">
    <div th:fragment="content">
        <div class="formular-container">

            <h2 class="formular-titel">Opret Lejeaftale</h2>


            <!--Success besked af oprettelse-->
            <p th:if="${param.success}" style="color: green;">
                Lejeaftale blev oprettet.
            </p>

            <!--Fejl besked af oprettelse-->
            <p th:if="${error}" th:text="${error}" style="color: red;"></p>


            <!--Form-->
            <form th:action="@{/lejeaftale/opret}" method="post">

                <!--Kunde Informationer-->
                <h3 class="formular-undertitel">Kunde</h3>

                <div class="felt-gruppe">
                    <label>Navn</label>
                    <input type="text" name="navn" required>
                </div>

                <div class="felt-gruppe">
                    <label>Mobil</label>
                    <input type="text" name="mobil" required>
                </div>

                <div class="felt-gruppe">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>

                <!--Lejeaftale Informationer-->
                <h3 class="formular-undertitel">Lejeaftale</h3>

                <div class="felt-gruppe">
                    <label>Medarbejder ID</label>
                    <input type="text" name="medarbejderId" required>
                </div>

                <div class="felt-gruppe">
                    <label>Vognnummer</label>
                    <input type="text" name="vognnummer" required>
                </div>

                <div class="felt-gruppe">
                    <label>Lokation</label>
                    <input type="text" name="lokation">
                </div>

                <div class="felt-gruppe">
                    <label>Startdato</label>
                    <input type="date" name="startDato" required>
                </div>

                <div class="felt-gruppe">
                    <label>Antal Måneder</label>
                    <input type="number" name="antalMaaneder" required>
                </div>

                <div class="felt-gruppe">
                    <label>Pris pr. måned</label>
                    <input type="number" step="0.01" name="prisPrMaaned" required>
                </div>

                <div class="felt-gruppe">
                    <label>Km grænse</label>
                    <input type="number" name="kmGraense" required>
                </div>

                <!--Submit Knap-->
                <button type="submit" class="indsend-knap">Opret Lejeaftale</button>

            </form>
        </div>
    </div>
</div>

<section class="end-block"></section>

</body>
</html>
